    // =========================================================================
    // DISCOUNT CALCULATION
    // =========================================================================
    function computeDiscountSummary(subtotal, method = 'ໂອນ') {
      const cleanSub = Math.max(0, Math.round(Number(subtotal) || 0));
      const discountRate = method === 'ຕິດຫນີ້' ? 5 : 15;
      const discountAmount = Math.round((cleanSub * discountRate) / 100);
      const netTotal = Math.max(0, cleanSub - discountAmount);
      return {
        subtotal: cleanSub,
        discountRate,
        discountAmount,
        netTotal,
      };
    }

    function recalculateBill(bill) {
      if (!bill) return bill;
      const subtotal =
        typeof bill.subtotal === 'number'
          ? bill.subtotal
          : (bill.items || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      const calc = computeDiscountSummary(subtotal, bill.paymentMethod || 'ໂອນ');
      bill.subtotal = calc.subtotal;
      bill.discountRate = calc.discountRate;
      bill.discountAmount = calc.discountAmount;
      bill.total = calc.netTotal;
      return bill;
    }

      const clean = String(numStr ?? '').replace(/\D+/g, '');
      if (clean.length < 2) return '';
      const group = findAnimalGroupByLastTwo(clean.slice(-2));
      return group ? `ນາມ ${String(group.id).padStart(2, '0')} • ${group.emoji.trim()} ${group.name}` : '';
    }

    function expandTemNam(numStr) {
      const clean = String(numStr ?? '').replace(/\D+/g, '');
      if (clean.length < 2 || clean.length > 6) return [];
      const prefix = clean.slice(0, -2);
      const lastTwo = clean.slice(-2);
      const group = findAnimalGroupByLastTwo(lastTwo);
      if (!group) return [clean];
      return Array.from(new Set(group.numbers.map((tail) => prefix + tail)));
    }

    function addNumberToCart(rawNumber, rawAmount = 5000) {
      const num = String(rawNumber ?? '').replace(/\D+/g, '');
      const amount = Math.max(1000, Math.round(Number(rawAmount) || 5000));
      if (num.length < 2 || num.length > 6) {
        return { added: false, reason: 'length' };
      }
      if (state.cart.some((item) => item.number === num)) {
        return { added: false, reason: 'duplicate' };
      }
      state.cart.push({ number: num, amount });
      saveAppState();
      refreshShellUI();
      return { added: true };
    }

    function addBatchToCart(numbersArray, rawAmount = 5000) {
      const amount = Math.max(1000, Math.round(Number(rawAmount) || 5000));
      let addedCount = 0;
      let skippedDupes = 0;

      for (const raw of numbersArray) {
        const res = addNumberToCart(raw, amount);
        if (res.added) addedCount++;
        else if (res.reason === 'duplicate') skippedDupes++;
      }

      return { addedCount, skippedDupes };
    }

    function copyTextToClipboard(text) {

        temp.value = text;
        temp.setAttribute('readonly', '');

        document.body.appendChild(temp);

        const ok = document.execCommand('copy');
        document.body.removeChild(temp);
        return Boolean(ok);
      } catch (err) {
        return false;
      }
    }

    function updateCountdownClock() {
      const now = new Date();
      const drawDateEl = document.getElementById('drawDateDisplay');
      const timerEl = document.getElementById('countdownTimer');
      if (!drawDateEl || !timerEl) return;

      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      drawDateEl.textContent = `ງວດວັນທີ ${dd}/${mm}/${yyyy}`;

      const cutoff = new Date(now);
      cutoff.setHours(20, 0, 0, 0);
      if (now >= cutoff) {
        cutoff.setDate(cutoff.getDate() + 1);
      }

      const diffMs = Math.max(0, cutoff - now);
      const totalSec = Math.floor(diffMs / 1000);
      const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      timerEl.textContent = `${hrs}:${mins}:${secs}`;
    }

    function generateRandomPreview() {
      const digits = randomSession.digits;
      const suffix = (randomSession.suffix || '').replace(/\D+/g, '').slice(0, digits);
      const slots = Math.max(1, Math.min(20, Number(randomSession.slots) || 1));

      const rawPick = [];
      for (let i = 0; i < slots; i++) {
        let candidate = '';
        if (suffix.length >= digits) {
          candidate = suffix.slice(-digits);
        } else {
          const randLen = digits - suffix.length;
          let randPart = '';
          for (let j = 0; j < randLen; j++) {
            randPart += String(Math.floor(Math.random() * 10));
          }
          candidate = randPart + suffix;
        }
        rawPick.push(candidate);
      }

      if (randomSession.temNam && digits >= 2) {
        const expandedSet = new Set();
        rawPick.forEach((n) => {
          expandTemNam(n).forEach((en) => expandedSet.add(en));
        });
        randomSession.preview = Array.from(expandedSet);
      } else {
        randomSession.preview = Array.from(new Set(rawPick));
      }
    }

    // =========================================================================
    // MODAL: "ຊື້ສະຫຼັບ"
    // =========================================================================
    function generateUniquePermutations(rawStr, targetLen = null) {
      const digits = String(rawStr ?? '').replace(/\D+/g, '').slice(0, 6);
      if (!digits) return [];
      const working = targetLen ? digits.slice(0, targetLen) : digits;
      if (!working) return [];

      const chars = working.split('').sort();
      const used = new Array(chars.length).fill(false);
      const current = [];
      const results = [];

      function backtrack() {
        if (current.length === chars.length) {
          results.push(current.join(''));
          return;
        }
        for (let i = 0; i < chars.length; i++) {
          if (used[i]) continue;
          if (i > 0 && chars[i] === chars[i - 1] && !used[i - 1]) continue;
          used[i] = true;
          current.push(chars[i]);
          backtrack();
          current.pop();
          used[i] = false;
        }
      }

      backtrack();
      return results;
    }

      swapSession.digits = d;

    function adjustSwapSlots(delta) {
      swapSession.slots = Math.max(1, Math.min(30, swapSession.slots + delta));
      renderSwapModal(document.getElementById('modalBody'));
    }

    function adjustSwapAmount(delta) {
      swapSession.amount = Math.max(1000, swapSession.amount + delta);
      renderSwapModal(document.getElementById('modalBody'));
    }

    function confirmSwapSelection() {
      const perms = generateUniquePermutations(swapSession.sourceInput, swapSession.digits)
        .slice(0, swapSession.slots)
        .filter((n) => n.length >= 2 && n.length <= 6);

      if (perms.length === 0) {
        showToast('ກະລຸນາປ້ອນເລກຢ່າງໜ້ອຍ 2 ຫຼັກເພື່ອສ້າງເລກສະຫຼັບ 2-6 ໂຕ');
        return;
      }

      const { addedCount, skippedDupes } = addBatchToCart(perms, swapSession.amount);
      closeModal();
      if (addedCount > 0) {
        showToast(`ເພີ່ມເລກສະຫຼັບ ${addedCount} ໂຕລົງກະຕ່າແລ້ວ${skippedDupes ? ` (ຂ້າມ ${skippedDupes} ຊ້ຳ)` : ''}`);

    function buildDraftBillFromCart(method = paymentSession.method) {
      const subtotal = state.cart.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      const calc = computeDiscountSummary(subtotal, method);
      const now = new Date();
      const billNo =
        'ID-' +
        now.getFullYear().toString().slice(-2) +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') +
        '-' +
        String(Math.floor(1000 + Math.random() * 9000));

      const timestamp = now.toLocaleString('lo-LA', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });

      return {
        id: billNo,
        shopName: SHOP_NAME,
        createdAt: timestamp,
        userProfile: state.userProfile,
        paymentMethod: method,
        customerNote: paymentSession.note || '',
        items: state.cart.map((x) => ({ number: x.number, amount: x.amount })),
        subtotal: calc.subtotal,
        discountRate: calc.discountRate,
        discountAmount: calc.discountAmount,
        total: calc.netTotal,
      };
    }

    function finalizeCartIntoBill() {
      if (state.cart.length === 0) return null;
      const createdBill = buildDraftBillFromCart(paymentSession.method);
      state.bills.unshift(createdBill);
      state.loyaltyPoints += Math.max(10, Math.floor(createdBill.total / 1000));
      state.cart = [];
      paymentSession.bill = createdBill;
      saveAppState();
      refreshShellUI();
      return createdBill;
    }

    function checkoutCartAndOpenPayment() {
      if (state.cart.length === 0) {
        showToast('ກະຕ່າວ່າງເປົ່າ');
        return;
      }
      const createdBill = finalizeCartIntoBill();
      if (!createdBill) return;

      document.getElementById('modalTitle').textContent = `💳 ຊຳລະເງິນ • ${SHOP_NAME}`;
      renderPaymentView(document.getElementById('modalBody'));
      showToast(`ສ້າງບິນ ${createdBill.id} ສຳເລັດແລ້ວ`);
    }

    function checkoutAndDispatch(channel) {
      if (state.cart.length === 0) {
        showToast('ກະຕ່າວ່າງເປົ່າ');
        return;
      }
      const createdBill = finalizeCartIntoBill();
      if (!createdBill) return;

      document.getElementById('modalTitle').textContent = `💳 ຊຳລະເງິນ • ${SHOP_NAME}`;
      renderPaymentView(document.getElementById('modalBody'));

      if (channel === 'messenger') {
        sendOrderViaMessenger(createdBill.id);
      } else {
        sendOrderViaWhatsApp(createdBill.id);
      }
    }

          recalculateBill(found);

        saveAppState();

      renderPaymentView(document.getElementById('modalBody'));

    function formatOrderReceipt(bill) {
      recalculateBill(bill);
      const discountLine =
        bill.paymentMethod === 'ຕິດຫນີ້'
          ? `ສ່ວນຫຼຸດ 5% ເມື່ອຕິດຫນີ້: -${formatKip(bill.discountAmount)}`
          : `ສ່ວນຫຼຸດ 15% ສະແກນຄິວອາ: -${formatKip(bill.discountAmount)}`;
      const lines = [
        `🏪 ${SHOP_NAME}`,
        `💳 ຜູ້ຮັບ: ${QR_ACCOUNT_HOLDER} (LAPNet / LAO QR)`,
        `🧾 ເລກບິນ: ${bill.id}`,

        `📅 ເວລາ: ${bill.createdAt}`,
        `💰 ຮູບແບບ: ${bill.paymentMethod}${bill.customerNote ? ` (${bill.customerNote})` : ''}`,
        `----------------------`,
        ...bill.items.map((it) => {
          const animal = getAnimalLabelForNumber(it.number);
          return `• ເລກ ${it.number}${animal ? ` [${animal}]` : ''} : ${formatKip(it.amount)}`;

        `----------------------`,
        `ຍອດກ່ອນຫຼຸດ: ${formatKip(bill.subtotal)}`,
        `${discountLine}`,
        `💵 ຍອດຊຳລະສຸດທິ: ${formatKip(bill.total)}`,
      ];
      return lines.join('\n');
    }

    function buildDispatchUrl(baseUrl, message) {
      const encoded = encodeURIComponent(message);
      const sep = baseUrl.includes('?') ? '&' : '?';
      return `${baseUrl}${sep}text=${encoded}`;
    }

    function openExternalDispatchLink(url, receipt, channelLabel) {
      paymentSession.lastDispatchReceipt = receipt;
      paymentSession.lastDispatchUrl = url;
      paymentSession.lastDispatchChannelLabel = channelLabel;

      const copied = copyTextToClipboard(receipt);
      let opened = false;

      try {
        const win = window.open(url, '_blank', 'noopener,noreferrer');
        if (win && !win.closed) {
          opened = true;
        }
      } catch (err) {
        opened = false;
      }

      if (!opened) {
        try {
          const a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          opened = true;
        } catch (err) {
          opened = false;
        }
      }

      if (document.getElementById('modalBody')) {
        renderPaymentView(document.getElementById('modalBody'));
      }

      if (copied && opened) {
        showToast(`ຄັດລອກອໍເດີແລ້ວ • ເປີດ ${channelLabel}`);
      } else if (copied) {
        showToast(`ຄັດລອກອໍເດີແລ້ວ • ກົດລິ້ງ ${channelLabel} ດ້ານລຸ່ມເພື່ອເປີດ`);
      } else {
        showToast(`ກຽມຂໍ້ມູນສົ່ງ ${channelLabel} ແລ້ວ`);
      }
    }

    function sendOrderViaWhatsApp(billId) {
      const bill =
        (paymentSession.bill && paymentSession.bill.id === billId && paymentSession.bill) ||
        state.bills.find((b) => b.id === billId);
      if (!bill) {
        showToast('ບໍ່ພົບຂໍ້ມູນບິນ');
        return;
      }
      const receipt = formatOrderReceipt(bill);
      const url = buildDispatchUrl(WHATSAPP_ORDER_URL, receipt);
      openExternalDispatchLink(url, receipt, `WhatsApp (${WHATSAPP_LOCAL})`);
    }

    function sendOrderViaMessenger(billId) {
      const bill =
        (paymentSession.bill && paymentSession.bill.id === billId && paymentSession.bill) ||
        state.bills.find((b) => b.id === billId);
      if (!bill) {
        showToast('ບໍ່ພົບຂໍ້ມູນບິນ');
        return;
      }
      const receipt = formatOrderReceipt(bill);
      const url = buildDispatchUrl(MESSENGER_ORDER_URL, receipt);
      openExternalDispatchLink(url, receipt, `Messenger (${MESSENGER_USERNAME})`);
    }

      const bill =
        (paymentSession.bill && paymentSession.bill.id === billId && paymentSession.bill) ||
        state.bills.find((b) => b.id === billId);
      if (!bill) {
        showToast('ບໍ່ພົບຂໍ້ມູນບິນ');
        return;
      }
      recalculateBill(bill);
      const found = state.bills.find((b) => b.id === bill.id);
      if (found) {
        found.paymentMethod = bill.paymentMethod;
        found.customerNote = bill.customerNote;
        recalculateBill(found);

      saveAppState();
      refreshShellUI();

      if (paymentSession.autoDispatch) {
        if (paymentSession.autoChannel === 'messenger') {
          sendOrderViaMessenger(bill.id);

          sendOrderViaWhatsApp(bill.id);

        const receipt = formatOrderReceipt(bill);
        paymentSession.lastDispatchReceipt = receipt;
        const copied = copyTextToClipboard(receipt);
        renderPaymentView(document.getElementById('modalBody'));
        showToast(copied ? 'ຢືນຢັນບິນ ແລະ ຄັດລອກຂໍ້ມູນອໍເດີແລ້ວ' : 'ຢືນຢັນບິນສຳເລັດແລ້ວ');

    function buyOldBillNumbers(billId) {
      const bill = state.bills.find((b) => b.id === billId);
      if (!bill || !Array.isArray(bill.items) || bill.items.length === 0) {
        showToast('ບໍ່ພົບລາຍການເລກໃນບິນນີ້');
        return;
      }

      let added = 0;
      let dupes = 0;
      for (const it of bill.items) {
        const res = addNumberToCart(it.number, it.amount);
        if (res.added) added++;
        else if (res.reason === 'duplicate') dupes++;
      }

      document.getElementById('modalTitle').textContent = '🛒 ຊື້ເລກ / ກະຕ່າສິນຄ້າ';
      renderCartModal(document.getElementById('modalBody'));
      showToast(`ດຶງເລກເກົ່າ ${added} ລາຍການລົງກະຕ່າແລ້ວ${dupes ? ` (ຂ້າມ ${dupes} ຊ້ຳ)` : ''}`);
    }

    function saveManualDrawForm(event) {
      event.preventDefault();
      const dateVal = (document.getElementById('manualDrawDateInput').value || '').trim();
      const numVal = (document.getElementById('manualWinningNumberInput').value || '').replace(/\D+/g, '');
      if (numVal.length < 2 || numVal.length > 6) {
        showToast('ກະລຸນາປ້ອນເລກຜົນງວດ 2 ຫາ 6 ໂຕ');
        return;
      }
      saveManualDrawResult({ drawDate: dateVal, winningNumber: numVal });
      showToast('ບັນທຶກຜົນງວດ ແລະ ກວດບິນແລ້ວ');
      renderResultsModal(document.getElementById('modalBody'));
    }

    function clearManualDrawResult() {
      localStorage.removeItem(MANUAL_RESULT_KEY);
      showToast('ລ້າງຜົນງວດທີ່ບັນທຶກແລ້ວ');
      renderResultsModal(document.getElementById('modalBody'));
    }

          icon: '🪔',
          desc: 'ແຕະປຸ່ມເພື່ອທາແປ້ງຂໍເລກໃຫ້ຕົວເລກຄ່ອຍໆປາກົດຂຶ້ນມາ.',
          actionLabel: 'ທາແປ້ງຂໍເລກໃໝ່',
          generate: () => [makeRandomDigits(2), makeRandomDigits(3), makeRandomDigits(4)],
        },
        guru_picks: {
          icon: '🔮',
          desc: 'ຊຸດເລກແນະນຳປະຈຳງວດ (ສ້າງແບບສຸ່ມເພື່ອໃຊ້ເປັນແນວທາງ).',
          actionLabel: 'ສ້າງຊຸດເລກແນະນຳໃໝ່',
          generate: () => [makeRandomDigits(2), makeRandomDigits(2), makeRandomDigits(3)],
        },
        dream_random: {
          icon: '🌙',
          desc: 'ສຸ່ມເລກຈາກຕຳລາສັດ 40 ນາມ ພ້ອມຊື່ນາມສັດປະຈຳເລກ.',
          actionLabel: 'ສຸ່ມຕາມຄວາມຝັນໃໝ່',
          generate: () => {
            const g1 = ANIMAL_GROUPS[Math.floor(Math.random() * ANIMAL_GROUPS.length)];
            const g2 = ANIMAL_GROUPS[Math.floor(Math.random() * ANIMAL_GROUPS.length)];
            const n1 = g1.numbers[Math.floor(Math.random() * g1.numbers.length)];
            const n2 = g2.numbers[Math.floor(Math.random() * g2.numbers.length)];
            return [n1, n2, makeRandomDigits(1) + n1];
          },
        },
        kuman_thong: {
          icon: '🧸',
          desc: 'ຂໍເລກນຳກຸມມານທອງ ໃຫ້ໂຊກລາບແບບບໍ່ຊ້ຳໃຜ.',
          actionLabel: 'ຂໍເລກນຳກຸມມານທອງ',
          generate: () => [makeRandomDigits(2), makeRandomDigits(3), makeRandomDigits(4)],
        },
        lucky_wheel: {
          icon: '🎡',
          desc: 'ໝຸນວົງລໍ້ທັງໂຊກທັງລວຍ ເພື່ອລຸ້ນເລກເດັດ.',
          actionLabel: 'ໝຸນວົງລໍ້',
          generate: () => [makeRandomDigits(2), makeRandomDigits(3), makeRandomDigits(5)],
          isWheel: true,
        },
      };

      const cfg = configs[toolKey] || configs.random_chaotic;
      const picks = Array.isArray(currentGenerated) && currentGenerated.length ? currentGenerated : cfg.generate();
      const safePicksJson = JSON.stringify(picks).replace(/"/g, '&quot;');

      container.innerHTML = `
        <div class="space-y-4 text-center">
          <div class="bg-[#FFF3EC] border border-[#FFD4BE] rounded-2xl p-4 space-y-2">
            <div class="${cfg.isWheel ? 'inline-block wheel-spinning' : ''} text-4xl">${cfg.icon}</div>
            <p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(cfg.desc)}</p>
          </div>

          <div class="flex flex-wrap items-center justify-center gap-2">
            ${picks
              .map((num) => {
                const label = getAnimalLabelForNumber(num);
                return `
                  <button
                    type="button"
                    onclick="addSingleSpecialPick('${num}')"
                    class="bg-white hover:bg-[#FFF8F4] active:scale-95 border-2 border-[#F25C19] rounded-2xl px-4 py-2.5 shadow-2xs transition text-center"
                  >
                    <div class="text-base font-extrabold text-[#F25C19] tracking-wider">${escapeHtml(num)}</div>
                    ${label ? `<div class="text-[10px] font-bold text-slate-500 mt-0.5">${escapeHtml(label)}</div>` : '<div class="text-[10px] font-bold text-slate-400 mt-0.5">+ ເພີ່ມ</div>'}
                  </button>
                `;
              })
              .join('')}
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <button
              type="button"
              onclick="rerollSpecialTool('${toolKey}')"
              class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-xs sm:text-sm py-3 rounded-2xl shadow transition"
            >
              ${escapeHtml(cfg.actionLabel)}
            </button>
            <button
              type="button"
              onclick="addAllSpecialPicks(${safePicksJson})"
              class="bg-[#F25C19] hover:bg-[#C94408] active:scale-95 text-white font-extrabold text-xs sm:text-sm py-3 rounded-2xl shadow transition"
            >
              + ເພີ່ມທັງໝົດ
            </button>
          </div>
        </div>
      `;
    }

    function rerollSpecialTool(toolKey) {
      const generators = {
        random_chaotic: () => [makeRandomDigits(2), makeRandomDigits(3), makeRandomDigits(6)],
        powder_rub: () => [makeRandomDigits(2), makeRandomDigits(3), makeRandomDigits(4)],
        guru_picks: () => [makeRandomDigits(2), makeRandomDigits(2), makeRandomDigits(3)],
        dream_random: () => {
          const g1 = ANIMAL_GROUPS[Math.floor(Math.random() * ANIMAL_GROUPS.length)];
          const g2 = ANIMAL_GROUPS[Math.floor(Math.random() * ANIMAL_GROUPS.length)];
          const n1 = g1.numbers[Math.floor(Math.random() * g1.numbers.length)];
          const n2 = g2.numbers[Math.floor(Math.random() * g2.numbers.length)];
          return [n1, n2, makeRandomDigits(1) + n1];
        },
        kuman_thong: () => [makeRandomDigits(2), makeRandomDigits(3), makeRandomDigits(4)],
        lucky_wheel: () => [makeRandomDigits(2), makeRandomDigits(3), makeRandomDigits(5)],
      };
      const nextPicks = (generators[toolKey] || generators.random_chaotic)();
      renderSpecialToolModal(document.getElementById('modalBody'), toolKey, nextPicks);
    }

    function addSingleSpecialPick(num) {
      const amt = Number(document.getElementById('quickAmountInput')?.value) || 5000;
      const res = addNumberToCart(num, amt);
      if (res.added) {
        showToast(`ເພີ່ມເລກ ${num} ລົງກະຕ່າແລ້ວ`);
      } else if (res.reason === 'duplicate') {
        showToast(`ເລກ ${num} ມີໃນກະຕ່າແລ້ວ`);
      }
    }

    function addAllSpecialPicks(picks) {
      const amt = Number(document.getElementById('quickAmountInput')?.value) || 5000;
      const { addedCount, skippedDupes } = addBatchToCart(picks, amt);
      closeModal();
      if (addedCount > 0) {
        showToast(`ເພີ່ມ ${addedCount} ເລກລົງກະຕ່າແລ້ວ${skippedDupes ? ` (ຂ້າມ ${skippedDupes} ຊ້ຳ)` : ''}`);
      } else {
        showToast('ເລກທັງໝົດມີໃນກະຕ່າແລ້ວ');
      }
    }

    // =========================================================================
    // INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      refreshShellUI();
      updateCountdownClock();
      setInterval(updateCountdownClock, 1000);
    });
  </script>
</body>
</html>
